[project]
name = "palworld-bot"
version = "0.1.0"
description = "Discord slash commands that control the Palworld dedicated server"
requires-python = ">=3.13"
# boto3 is provided by the Lambda runtime and is deliberately absent here so it
# does not enter the deployment package.
dependencies = ["pynacl>=1.5"]

[tool.uv]
package = false

[dependency-groups]
# boto3 stays out of [project.dependencies] (see above) but tests need it to
# build the mocks the Lambda runtime would otherwise supply.
dev = ["pytest>=8.0", "boto3>=1.34"]
